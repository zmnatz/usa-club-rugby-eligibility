name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  # Builds `public/data` from the PR's base and head and keeps one sticky comment on
  # the PR with what changed, in place of the old committed-data diff (ADR 011). The
  # data is derived, so it is never committed: the comparison is the review.
  data-diff:
    name: Published data change
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A fork's token can't comment; its run still writes the job summary.
      pull-requests: write
    concurrency:
      group: data-diff-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The base SHA is not in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile

      # Base first, so the head's generated data never leaks into it. A base from
      # before #80 has committed data and no `data` script, so its copy is used.
      - name: Build the base's data
        run: |
          git checkout --force "$BASE_SHA"
          bun install --frozen-lockfile
          if grep -q '"data"[[:space:]]*:' package.json; then
            bun run data
          elif [ -d public/data ]; then
            echo "The base predates the build-time data; using its committed copy."
          else
            bun run lib
            node packages/usa-club-rugby-data/dist/cli.js build
          fi
          mv public/data /tmp/data-base

      - name: Build the head's data
        run: |
          git checkout --force "$HEAD_SHA"
          bun install --frozen-lockfile
          bun run data

      - name: Compare the two builds
        run: >-
          node test/ci/data-diff.ts
          --base /tmp/data-base
          --head public/data
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --out comment.md

      - name: Add the summary to the job
        run: cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- pr-data-diff -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

  # Builds the site, serves it with `next start` (as Netlify's runtime does) and
  # screenshots it, then keeps one sticky comment on the PR up to date. The job is
  # the shared workflow in zmnatz/code-review, which stores the images on the orphan
  # `pr-screenshots` branch so they can be embedded inline. Pages come from the PR
  # description's `## Screenshots` section plus routes mapped from changed files
  # (.github/screenshots/rules.yml); `/` is always included.
  screenshots:
    name: Screenshots
    # A fork's token can't push the images or comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: zmnatz/code-review/.github/workflows/screenshots.yml@v1
    permissions:
      contents: write
      pull-requests: write
    with:
      rules: .github/screenshots/rules.yml
      noise: .github/screenshots/noise.yml
      bun-version: 1.4.4
      node-version-file: .nvmrc
      # `{player}` in a route stands for any player in the published index, so the
      # route can't go stale when the nightly data changes. A full build has
      # generated public/data by the time this runs.
      vars: >-
        node -e "const k = Object.keys(require('./public/data/players.json').players ?? {}).sort();
        console.log('player=' + (k[0] ?? 'none'))"
