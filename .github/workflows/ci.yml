name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  # Builds `public/data` from the PR's base and head and keeps one sticky comment on
  # the PR with what changed, in place of the old committed-data diff (ADR 011). The
  # data is derived, so it is never committed: the comparison is the review.
  data-diff:
    name: Published data change
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # A fork's token can't comment; its run still writes the job summary.
      pull-requests: write
    concurrency:
      group: data-diff-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The base SHA is not in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile

      # Base first, so the head's generated data never leaks into it. A base from
      # before #80 has committed data and no `data` script, so its copy is used.
      - name: Build the base's data
        run: |
          git checkout --force "$BASE_SHA"
          bun install --frozen-lockfile
          if grep -q '"data"[[:space:]]*:' package.json; then
            bun run data
          elif [ -d public/data ]; then
            echo "The base predates the build-time data; using its committed copy."
          else
            bun run lib
            node packages/usa-club-rugby-data/dist/cli.js build
          fi
          mv public/data /tmp/data-base

      - name: Build the head's data
        run: |
          git checkout --force "$HEAD_SHA"
          bun install --frozen-lockfile
          bun run data

      - name: Compare the two builds
        run: >-
          node test/ci/data-diff.ts
          --base /tmp/data-base
          --head public/data
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --out comment.md

      - name: Add the summary to the job
        run: cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update the PR comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- pr-data-diff -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi

  # Builds a few clubs in the Playwright container, serves the build with `next start`
  # and screenshots it (Netlify's deploy preview has the full build), stores the images
  # on the orphan `pr-screenshots` branch so they can be embedded inline, and keeps
  # one sticky comment on the PR up to date. Pages come from the PR description's
  # `## Screenshots` section plus routes mapped from changed files
  # (test/playwright/config/screenshots.yml); `/` is always included.
  screenshots:
    name: Screenshots
    # A fork's token can't push the images or comment.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: screenshots-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    container:
      # Floating tag: the newest Playwright image, with Chromium and its system
      # libraries preinstalled.
      image: mcr.microsoft.com/playwright:noble
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      # The image lacks the GitHub CLI and git, and setup-bun needs unzip.
      - name: Install the GitHub CLI, git and unzip
        run: apt-get update -qq && apt-get install -y -qq gh git unzip

      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile

      - name: Read the PR description and changed files
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body -q .body > pr-body.md
          # Not `gh pr diff`, which fails above 300 files.
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > changed-files.txt

      # build-clubs.ts reads the club list from the generated data.
      - run: bun run data

      # The default club, plus the clubs of any club or player pages the PR lists.
      - name: Work out which clubs to build
        id: clubs
        run: node test/playwright/build-clubs.ts --default pittsburgh-forge --pr-body pr-body.md >> "$GITHUB_OUTPUT"

      # A partial build, never deployed. selectClubs ignores BUILD_CLUBS only on
      # Netlify, so a deployed site is always complete.
      - name: Build those clubs
        env:
          BUILD_CLUBS: ${{ steps.clubs.outputs.clubs }}
        run: bun run build

      # Only the screenshot tooling's own dependencies, not the site's.
      - name: Install the screenshot tooling
        working-directory: test/playwright
        run: npm install --no-audit --no-fund --no-package-lock

      # A no-op when the image's browser build matches the Playwright version
      # installed above; otherwise it fetches just the matching Chromium.
      - name: Ensure the matching Chromium
        working-directory: test/playwright
        run: npx playwright-core install chromium

      # Starts the build with `next start` and captures it.
      - name: Take screenshots
        run: node test/playwright/screenshots.ts --app . --changed-files changed-files.txt --pr-body pr-body.md --out screenshots

      - name: Publish images to the pr-screenshots branch
        if: always() && hashFiles('screenshots/report.json') != ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin pr-screenshots >/dev/null; then
            git fetch origin pr-screenshots
            git worktree add shots-branch origin/pr-screenshots --detach
          else
            git worktree add --orphan -b pr-screenshots shots-branch
          fi
          dir="shots-branch/pr-$PR/$SHA"
          mkdir -p "$dir"
          cp screenshots/*.png "$dir/"
          cd shots-branch
          git add -A
          git commit -m "Screenshots for PR $PR at $SHA" || true
          # Other PRs push to this branch too.
          for attempt in 1 2 3; do
            git push origin HEAD:pr-screenshots && exit 0
            git fetch origin pr-screenshots
            git rebase origin/pr-screenshots
          done
          exit 1

      - name: Build the comment
        if: always() && hashFiles('screenshots/report.json') != ''
        run: |
          node test/playwright/screenshot-comment.ts \
            --report screenshots/report.json \
            --image-base-url "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/pr-screenshots/pr-$PR/$SHA" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --sha "$SHA" \
            --out comment.md

      - name: Create or update the PR comment
        if: always() && hashFiles('comment.md') != ''
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- pr-screenshots -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
