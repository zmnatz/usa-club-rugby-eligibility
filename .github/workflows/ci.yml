name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run verify
      - run: bun run build

  # A build of the branch to look at before it merges. GitHub Pages serves one
  # site per repository, so a preview can't be hosted beside it; this one is built
  # for the root path, so unzip it and serve the folder with any static server
  # (for example `bunx serve dist`). Checks stay in the job above.
  preview:
    name: Preview build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - name: Build for the root path
        env:
          BASE_PATH: ""
        run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview-${{ github.event.pull_request.number }}
          path: dist
          retention-days: 7
          compression-level: 9
