name: Snapshot

# Nightly: refresh the raw match archive from the CMS and open and merge a pull request if anything changed.
# The merge into main is what deploys: Netlify builds every push to main (ADR 012). See docs/snapshots.md.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      full_history:
        description: "Also read every past season the feeds list (slow; for filling in the archive)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Refresh snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      # The data as it stands, to compare the refreshed archive with.
      - name: Build the data from the current archive
        run: bun run data
      - name: Keep the current data to compare with
        run: mv public/data /tmp/data-base

      - name: Refresh the archive
        run: bun run snapshot ${{ inputs.full_history && '--full-history' || '' }}

      # One entry per night, kept only when the published data actually changed.
      - name: Record the change on the changes page
        run: >-
          node test/ci/changes-page.ts
          --base /tmp/data-base
          --head public/data
          --page pages/changes.mdx
          --date "$(date -u +%F)"

      - name: Open a pull request and merge it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add archive pages/changes.mdx
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main is protected: changes go through a pull request
          branch="snapshot/${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m "Nightly snapshot update"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Nightly snapshot update" \
            --body "Automated refresh of \`archive\` from the nightly snapshot.")
          # Merge now so Netlify deploys the new data; fall back to auto-merge if
          # required checks are still pending.
          gh pr merge "$url" --squash --delete-branch || gh pr merge "$url" --squash --delete-branch --auto
