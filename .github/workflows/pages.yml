name: Snapshot and deploy

# Nightly: refresh the raw match archive from the CMS, recalculate the published
# data, open and merge a pull request if anything changed, then build and deploy GitHub Pages.
# A push to main redeploys without touching the CMS. See docs/snapshots.md.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      full_history:
        description: "Also read every past season the feeds list (slow; for filling in the archive)"
        type: boolean
        default: false
      offline:
        description: "Rebuild the published data from the archive only, with no CMS requests"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    name: Refresh snapshot
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile

      - name: Refresh the archive and published data
        run: bun run snapshot ${{ inputs.full_history && '--full-history' || '' }} ${{ inputs.offline && '--offline' || '' }}

      - name: Check the published data reproduces from the archive
        run: bun run verify

      - name: Open a pull request and merge it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add archive public/data
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main is protected: changes go through a pull request
          branch="snapshot/${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m "Nightly snapshot update"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Nightly snapshot update" \
            --body "Automated refresh of \`archive\` and \`public/data\` from the nightly snapshot.")
          # Merge now so the deploy job below builds the new data; fall back to
          # auto-merge if required checks are still pending.
          gh pr merge "$url" --squash --delete-branch || gh pr merge "$url" --squash --delete-branch --auto

  deploy:
    name: Build and deploy
    needs: snapshot
    # Runs after a snapshot, and on a push when the snapshot job is skipped.
    if: ${{ !cancelled() && (needs.snapshot.result == 'success' || needs.snapshot.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
