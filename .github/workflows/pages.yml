name: Snapshot and deploy

# Nightly: refresh the raw match archive from the CMS, open and merge a pull request if anything changed, then build and deploy GitHub Pages.
# A push to main redeploys without touching the CMS. See docs/snapshots.md.
on:
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC
  workflow_dispatch:
    inputs:
      full_history:
        description: "Also read every past season the feeds list (slow; for filling in the archive)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  snapshot:
    name: Refresh snapshot
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile

      - name: Refresh the archive
        run: bun run snapshot ${{ inputs.full_history && '--full-history' || '' }}

      - name: Open a pull request and merge it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add archive
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main is protected: changes go through a pull request
          branch="snapshot/${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m "Nightly snapshot update"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Nightly snapshot update" \
            --body "Automated refresh of \`archive\` from the nightly snapshot.")
          # Merge now so the deploy job below builds the new data; fall back to
          # auto-merge if required checks are still pending.
          gh pr merge "$url" --squash --delete-branch || gh pr merge "$url" --squash --delete-branch --auto

  deploy:
    name: Build and deploy
    needs: snapshot
    # Runs after a snapshot, and on a push when the snapshot job is skipped.
    if: ${{ !cancelled() && (needs.snapshot.result == 'success' || needs.snapshot.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

      - uses: actions/configure-pages@v5
      # Named per attempt: a re-run keeps the earlier attempt's artifact, and
      # deploy-pages refuses to choose between two with the same name.
      - id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      # Pages sometimes stalls in syncing_files until deploy-pages gives up at its
      # 10-minute cap, though a normal sync takes seconds; the same artifact has
      # done both. It is intermittent on GitHub's side and not about the
      # artifact's size (ADR 007). deploy-pages cancels a deployment that times out.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
      # deploy-pages names its deployment after the commit, so running it again
      # reuses the cancelled deployment's ID, and such a retry stalled too. Retry
      # through the Pages API with a build version of its own instead.
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const buildVersion = `${context.sha}-retry-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            const { data: created } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner,
              repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: buildVersion,
              oidc_token: await core.getIDToken(),
            });
            const deploymentId = created.id || created.status_url?.split('/').pop() || buildVersion;
            core.info(`Created deployment ${deploymentId} for ${buildVersion}`);
            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled',
              'deployment_perms_error', 'deployment_lost'];
            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              await new Promise((resolve) => setTimeout(resolve, 10000));
              const { data } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', {
                owner,
                repo,
                deploymentId,
              });
              core.info(`Current status: ${data.status}`);
              if (data.status === 'succeed') {
                core.setOutput('page_url', created.page_url);
                return;
              }
              if (failed.includes(data.status)) return core.setFailed(`Pages deployment ended in ${data.status}.`);
            }
            await github
              .request('POST /repos/{owner}/{repo}/pages/deployments/{deploymentId}/cancel', { owner, repo, deploymentId })
              .catch((error) => core.warning(`Cancelling the deployment failed: ${error.message}`));
            core.setFailed('The retry timed out too. Push a new commit or re-run the job later.');
