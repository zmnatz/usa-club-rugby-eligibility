name: Publish library

# Publishes @zmnatz/usa-club-rugby-data to npm when a GitHub release is published,
# by npm trusted publishing (OIDC): no token is stored. Configure it once at
# npmjs.com > the package > Settings > Trusted Publisher: GitHub Actions, this
# repository, workflow file publish.yml, allowing `npm publish`.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run verify
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older one.
      - run: npm install -g npm@latest
      - run: npm publish --access public
        working-directory: packages/usa-club-rugby-data
