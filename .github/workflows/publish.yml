name: Publish library

# Publishes @zmnatz/usa-club-rugby-data to npm when a GitHub release is published,
# by npm trusted publishing (OIDC): no token is stored. Configure it once at
# npmjs.com > the package > Settings > Trusted Publisher: GitHub Actions, this
# repository, workflow file publish.yml, with `npm publish` left unchecked.
# The job only stages the version; approve it with 2FA on npmjs.com (Staged
# Packages) or with `npm stage approve <stage-id>` and it goes public.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run verify
      # Staged publishing needs npm 11.15.0 or later, which Node 26 ships.
      - run: npm stage publish
        working-directory: packages/usa-club-rugby-data
