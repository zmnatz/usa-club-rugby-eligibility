name: Publish packages

# Publishes every package to npm, at the version the release's tag names, when a
# GitHub release is published, by npm trusted publishing (OIDC): no token is stored.
# See docs/releasing.md, which also has the one-time npm setup for each package.
# The job only stages each version; approve them with 2FA on npmjs.com (Staged
# Packages) or with `npm stage approve <stage-id>` and they go public.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: release
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/resolve-release.sh "$TAG"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run verify
      # The tag is the version of every package: no package.json in the repo has
      # one. Set after install, so the lockfile still matches, and with each
      # component package needing this same data package. Data goes first, as the
      # others need it.
      # Staged publishing needs npm 11.15.0 or later, which Node 26 ships.
      - name: Stage every package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          for package in usa-club-rugby-data usa-club-rugby-components usa-club-rugby-html; do
            cd "packages/$package"
            npm pkg set version="$VERSION"
            if [[ "$package" != usa-club-rugby-data ]]; then
              npm pkg set "peerDependencies.@zmnatz/usa-club-rugby-data=$VERSION"
            fi
            npm stage publish
            cd - > /dev/null
          done
