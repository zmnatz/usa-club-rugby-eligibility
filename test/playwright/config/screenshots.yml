# PR screenshots (test/playwright/screenshots.ts). The home page is always captured.
# When a PR changes a file matching `files`, the listed routes are captured too.
# A route may add `waitFor` (selector) or `delayMs` for pages that fill in after
# load; the default is network idle plus a short settle.
#
# Club and player pages are generated on request, so any of them can be listed.
# `{player}` stands for any player in the published index.
rules:
  - files:
      - src/styles/**
      - packages/usa-club-rugby-html/src/styles.css
      - pages/_app.tsx
      - pages/_document.tsx
    routes:
      - path: /club/pittsburgh-forge/
      - path: /player/{player}/
      - path: /csv/
      - path: /methodology/
      - path: /changes/
  - files:
      - pages/club/**
      - packages/usa-club-rugby-html/src/ClubEligibilityReport.tsx
      - packages/usa-club-rugby-html/src/EligibilityReportView.tsx
      - packages/usa-club-rugby-html/src/EligibilityStatusChip.tsx
    routes:
      - path: /club/pittsburgh-forge/
  - files:
      - pages/player/**
      - packages/usa-club-rugby-html/src/PlayerDetail.tsx
      - packages/usa-club-rugby-html/src/EligibilityStatusChip.tsx
    routes:
      - path: /player/{player}/
  - files:
      - pages/season/**
      - proxy.ts
    routes:
      - path: /season/
      - path: /season/2024-25/
      - path: /season/2024-25/akron/
  - files:
      - pages/csv.tsx
      - packages/usa-club-rugby-html/src/MatchParticipationReport.tsx
    routes:
      - path: /csv/
  - files:
      - pages/methodology.mdx
    routes:
      - path: /methodology/
  - files:
      - pages/changes.mdx
      - test/ci/**
    routes:
      - path: /changes/
